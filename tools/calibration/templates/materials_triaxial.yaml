LCM:
  ElementBlocks:
    Block0:
      material: CapModelTriaxial
  Materials:
    # Triaxial calibration material. Same jinja placeholders as materials.yaml
    # (one physical parameter set drives every load path), but the block maps
    # to CapModelTriaxial to match input_triaxial.yaml. With psi<1, theta!=0
    # and L/phi/Q distinct from D/theta/R the Lode-angle and non-associative
    # terms are active, so the triaxial response constrains A, C, theta, psi,
    # L, phi, Q.
    #
    # Units: base SI (stress in Pa, D/L/D1 in 1/Pa, D2 in 1/Pa^2), written in
    # scientific notation rather than with prefixed units. See lcm_model.py.
    CapModelTriaxial:
      Material Model:
        Model Name: Cap
      # Kinematics; see the note in materials.yaml. Set with
      # --finite-deformation / --small-strain.
      Finite Deformation: {{ finite_deformation }}
      Elastic Modulus: {Elastic Modulus Type: Constant, Value: {{ elastic_modulus }}}
      Poissons Ratio: {Poissons Ratio Type: Constant, Value: {{ poissons_ratio }}}
      A: {{ A }}
      D: {{ D }}
      C: {{ C }}
      theta: {{ theta }}
      R: {{ R }}
      kappa0: {{ kappa0 }}
      W: {{ W }}
      D1: {{ D1 }}
      D2: {{ D2 }}
      calpha: {{ calpha }}
      psi: {{ psi }}
      N: {{ N }}
      L: {{ L }}
      phi: {{ phi }}
      Q: {{ Q }}
      # Cohesion softening by bond breakage (CapSoftening.hpp): off unless
      # --softening. The three numbers are placeholders like any other, so
      # they can be fitted; with softening off they are inert.
      Softening: {{ softening }}
      Coherence Residual: {{ coherence_residual }}
      Failure Strain: {{ failure_strain }}
      Failure Speed: {{ failure_speed }}

