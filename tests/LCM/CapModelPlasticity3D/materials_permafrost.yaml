LCM:
  ElementBlocks:
    Block0:
      material: Permafrost
  Materials:
    # Phase-1 equivalence check: with both end members set to the Salem
    # limestone values and ice saturation at its default (1.0, frozen),
    # the Permafrost parameter map must reproduce CapModel
    # (and hence the reference implementation). The elastic constants are
    # the exact (K, G) images of Salem's E = 22547, nu = 0.2524.
    Permafrost:
      Material Model:
        Model Name: Permafrost
      Finite Deformation: false
      # Porosity at which the end members below were calibrated: the
      # normalizer of the ice volume fraction phi = S n / n_ref that
      # drives the cohesion/bonding and elasticity interpolation. Set to
      # the frozen crushable volume W, so that an uncrushed frozen point
      # sits exactly at the frozen end member.
      Reference Porosity: 0.08

      Frozen Parameters:
        K: 1.517703284868067e10
        G: 9.001517087192591e9
        A: 6.892e8
        C: 6.752e8
        N: 6.0e6
        kappa0: -8.05e6
        W: 0.08
        D1: 1.47e-9
        calpha: 1.0e11
      Thawed Parameters:
        K: 1.517703284868067e10
        G: 9.001517087192591e9
        A: 6.892e8
        C: 6.752e8
        N: 6.0e6
        kappa0: -8.05e6
        W: 0.08
        D1: 1.47e-9
        calpha: 1.0e11
        D: 3.94e-10
        theta: 0.0
        L: 3.94e-10
        phi: 0.0
        R: 28.0
        Q: 28.0
        psi: 1.0
        D2: 0.0
