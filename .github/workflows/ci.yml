name: CI

on:
  schedule:
    - cron: '0 7 * * *'  # midnight MT (UTC-7) daily
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      LCM_DIR: ${{ github.workspace }}
      # Open MPI 5 counts physical cores as slots, fewer than the 4 ranks of
      # the parallel tests on a hosted runner. Its process launcher, PRRTE,
      # reads this variable. The Open MPI 4 variable
      # OMPI_MCA_rmaps_base_oversubscribe has no effect on it.
      PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libblas-dev libboost-dev libboost-program-options-dev \
          cmake g++ gfortran git \
          libhdf5-openmpi-dev liblapack-dev libnetcdf-dev \
          libopenmpi-dev mpi-default-bin environment-modules \
          libgtest-dev python3-numpy python3-scipy

    # The image behind ubuntu-latest changes without notice. The versions
    # printed here identify the toolchain of each run.
    - name: Print toolchain
      run: |
        echo "Runner image: $ImageOS $ImageVersion"
        . /etc/os-release && echo "OS: $PRETTY_NAME"
        g++ --version | head -1
        echo "cmake: $(command -v cmake)"; cmake --version | head -1
        mpiexec --version | head -1
        lscpu | grep -E '^(CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)):'

    - name: Clone Trilinos
      run: |
        git clone -q --depth 1 -b develop \
          https://github.com/trilinos/Trilinos.git $LCM_DIR/Trilinos

    - name: Clone LCM
      uses: actions/checkout@v4
      with:
        path: LCM

    - name: Build and test
      run: |
        cd $LCM_DIR
        ln -sf LCM/doc/lcm/build/lcm .
        source /usr/share/modules/init/bash
        export MODULEPATH=$LCM_DIR/LCM/doc/lcm/modulefiles:$MODULEPATH
        module load release
        ./lcm all $(nproc) --quiet

    # The ctest script swallows the compiler's output, so a failed build shows
    # only "N Compiler errors" in the run log. The driver's own log and ctest's
    # Build.xml carry the actual messages. The run log shows only Passed or
    # Failed per test. The computed values and messages are in the test
    # log of ctest, which the dashboard script names LastTest_<stamp>.log.
    - name: Upload build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          ${{ github.workspace }}/*.log
          ${{ github.workspace }}/lcm-build-serial-gcc-release/Testing/**/Build.xml
          ${{ github.workspace }}/lcm-build-serial-gcc-release/Testing/Temporary/LastTest_*.log
        if-no-files-found: warn
