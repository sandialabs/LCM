LCM:
  ElementBlocks:
    Block0:
      material: CapModel
  Materials:
    # Cap plasticity material for calibration. Every calibratable value is a
    # jinja placeholder ({{ name }}); MatCal renders this file in each
    # evaluation working directory, substituting study parameters (highest
    # precedence) and model constants (the defaults in site_matcal.lcm_model,
    # e.g. the Salem-limestone set of Sun, Chen & Ostien 2014).
    #
    # Units: base SI. Stress-like values (A, C, N, kappa0, calpha, Elastic
    # Modulus) are in Pa, D/L/D1 in 1/Pa, D2 in 1/Pa^2; magnitudes are written
    # in scientific notation, never with prefixed units. See lcm_model.py.
    CapModel:
      Material Model:
        Model Name: Cap
      # Kinematics. true (the harness default) selects the
      # exponential/logarithmic-map kernel, which integrates in logarithmic
      # elastic strain / Kirchhoff stress and consumes F, J and Fp; it writes
      # NO Strain field. false selects the small-strain kernel, which consumes
      # the infinitesimal Strain field instead. Set with --finite-deformation
      # / --small-strain; see site_matcal.lcm_model.
      Finite Deformation: {{ finite_deformation }}
      Elastic Modulus: {Elastic Modulus Type: Constant, Value: {{ elastic_modulus }}}
      Poissons Ratio: {Poissons Ratio Type: Constant, Value: {{ poissons_ratio }}}
      A: {{ A }}
      D: {{ D }}
      C: {{ C }}
      theta: {{ theta }}
      R: {{ R }}
      kappa0: {{ kappa0 }}
      W: {{ W }}
      D1: {{ D1 }}
      D2: {{ D2 }}
      calpha: {{ calpha }}
      psi: {{ psi }}
      N: {{ N }}
      L: {{ L }}
      phi: {{ phi }}
      Q: {{ Q }}
      # Cohesion softening by bond breakage (CapSoftening.hpp): off unless
      # --softening. The three numbers are placeholders like any other, so
      # they can be fitted; with softening off they are inert.
      Softening: {{ softening }}
      Coherence Residual: {{ coherence_residual }}
      Failure Strain: {{ failure_strain }}
      Failure Speed: {{ failure_speed }}

